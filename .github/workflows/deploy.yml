# 1. 업무매뉴얼 이름 설정
name: Nginx + Node + React Deployment

# 2. 업무매뉴얼 동작 시점 설정
on:
    push:
        branches: ["main"]
    workflow_dispatch:
    
# 3. 업무매뉴얼을 더 작은 단위로 쪼개서,해야할 일을 작성
jobs:
  # 1) 프론트(React/Vite) 빌드 & Public(Nginx) 배포
  # 배포되는 환경에 대해서 기본적인 설정을 잡아놓는 공간  
  build-and-deploy-frontend:    #주관적으로 정한 이름
    runs-on: ubuntu-latest      #어떤 환경에서 돌릴건지
    defaults:
      run:
        shell: bash             #어떤 쉘로 스크립트를 실행할건지 

    steps:
      # (1) 레포 체크아웃
      - name: Checkout               #업무매뉴얼이 실행되는 시점의 레포 상태를 가져오는 단계
        uses: actions/checkout@v4    #github에서 공식적으로 제공하는 (이미 잘 짜여진 코드를 가져와서)액션으로,
                                     #레포를 체크아웃하는 역할을 함. v4는 버전

      # (2) React 빌드용 Node 세팅
      - name: Setup Node (for building React)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      # (3) React 빌드 -> client/dist 생성
      - name: Build React (client/dist)
        working-directory: client
        run: |                       # uses로는 안되는, 직접 작성해야하는 스크립트는 run으로 작성
          npm ci
          npm run build
          test -d dist

      # (4-0) Public 서버에 dist 업로드 받을 폴더 생성
      - name: Ensure web root exists on Public
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PUBLIC_HOST }}      # 변수 설정. secrets는 github 저장소의 Settings > Secrets and variables > Actions에서 등록한 값들을 가져오는 방법
          username: ${{ secrets.PUBLIC_USER }}  # 사용자명도 보통 root나 ubuntu 같은걸 넣어주면 됨
          key: ${{ secrets.PUBLIC_SSH_KEY }}    # SSH 키는 보통 id_rsa 형식의 개인키를 넣어주면 됨. 공개키는 Public 서버의 ~/.ssh/authorized_keys에 등록되어 있어야 함
          # -p 옵션은 이미 폴더가 존재해도 에러 안나게 해주는 옵션
          script: |                                          
            sudo mkdir -p "/usr/share/nginx/html"       
            sudo chown -R $USER:$USER "/usr/share/nginx/html" || true

      # (4) dist를 Public 서버 Nginx root로 업로드
      - name: Upload dist to Public Server (Nginx web root)
        uses: appleboy/scp-action@v0.1.7         
          host: ${{ secrets.PUBLIC_HOST }}
          username: ${{ secrets.PUBLIC_USER }}
          key: ${{ secrets.PUBLIC_SSH_KEY }}
          source: "client/dist/**"
          target: "/usr/share/nginx/html"
          strip_components: 2

      # (5) nginx 설정 검사 후 reload
      - name: Reload Nginx on Public
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PUBLIC_HOST }}
          username: ${{ secrets.PUBLIC_USER }}
          key: ${{ secrets.PUBLIC_SSH_KEY }}
          script: |
            sudo nginx -t
            sudo systemctl reload nginx


  # 2) 백엔드(Node/PM2) Private 서버 배포 (Public을 Bastion으로 경유)
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [build-and-deploy-frontend]    
    defaults:
      run:
        shell: bash

    steps:
    - name: Deploy backend to Private via Public (Bastion)   #
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PUBLIC_HOST }}
        username: ${{ secrets.PUBLIC_USER }}
        key: ${{ secrets.PUBLIC_SSH_KEY }}
        script: |
          set -e

          # Public -> Private 접속
          ssh -o StrictHostKeyChecking=no root@10.10.20.6 "bash -lc '
            set -e

            # (1) nvm 로드 (비로그인 쉘에서도 node/npm 사용 가능하게)
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"

            # (2) 원하는 Node 버전 활성화
            nvm use --lts

            # (3) 레포 동기화
            REPO_URL=\"${{ secrets.REPO_URL }}\"
            APP_DIR=\"${{ secrets.PRIVATE_APP_DIR }}\"

            if [ ! -d \"\$APP_DIR/.git\" ]; then
              git clone \"\$REPO_URL\" \"\$APP_DIR\"
            fi

            cd \"\$APP_DIR\"
            git fetch --all
            git reset --hard origin/main

            # (4) 백엔드 의존성 설치 + PM2 재기동
            cd \"\$APP_DIR/server\"
            npm ci --omit=dev

            pm2 describe myproj-server >/dev/null 2>&1 \
              && pm2 reload myproj-server \
              || pm2 start server.js --name myproj-server

            pm2 save
          '"